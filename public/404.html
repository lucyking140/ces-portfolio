<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      window.location.replace(
        "/?p=" +
          encodeURIComponent(
            window.location.pathname +
              window.location.search +
              window.location.hash,
          ),
      );
    </script>
  </head>
</html>
